# .github/workflows/eval.yml
name: eval-suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run eval suite
        id: evals
        run: |
          mkdir -p reports
          pytest tests/eval/ \
            --tb=short \
            --junitxml=reports/eval-junit.xml \
            -o junit_family=legacy \
            --maxfail=20 \
            -q | tee reports/eval-stdout.txt

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('reports/eval-stdout.txt', 'utf8');
            const tail = out.split('\n').slice(-40).join('\n');
            const status = '${{ job.status }}' === 'success'
              ? '✅ eval passed'
              : '❌ eval FAILED';
            const body = [
              `### ${status}`,
              '',
              '<details><summary>Tail of eval output</summary>',
              '',
              '```',
              tail,
              '```',
              '',
              '</details>',
              '',
              `Full report: see workflow run artifacts.`
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
