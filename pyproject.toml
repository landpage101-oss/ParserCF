[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-parser"
version = "0.1.0"
description = "Universal scraper agent on Claude Code + Firecrawl with safety perimeter"
requires-python = ">=3.12"
authors = [{ name = "Vitae", email = "landpage101@gmail.com" }]
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7,<3",
  "firecrawl-py>=1.6",
  "PyYAML>=6.0",
  "anthropic>=0.34",
  "markdownify>=0.13",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-beautifulsoup4",
  "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",        # pydocstyle - временно отключено, включим в Phase 2
  "ANN101",   # missing-type-self - устаревшее правило
  "ANN102",   # missing-type-cls - устаревшее правило
  "COM812",   # trailing-comma - конфликтует с форматтером
  "ISC001",   # implicit-string-concat - конфликтует с форматтером
  "S101",     # assert - разрешено в тестах (см. per-file)
  "PLR0913",  # too-many-arguments - часто нужно для DI
  "FBT",      # boolean-trap - стилистическое
  "TD",       # todos - не блокировать на формате todo-комментариев
  "FIX",      # fixme - аналогично
  "EM101",    # exception must not use string literal - validators used verbatim from spec
  "EM102",    # exception must not use f-string literal - same reason
  "TRY003",   # long exception message outside exception class - same reason
  "ANN401",   # dynamically typed Any in **kwargs - correct for generic span attrs
  "TCH003",   # stdlib imports to TYPE_CHECKING - breaks Pydantic get_type_hints at runtime
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "INP001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
module = ["firecrawl.*", "markdownify.*", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
